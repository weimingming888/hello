name: Android14-6.1-KO 优化
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 磁盘清理
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      # 缓存1：内核源码，固定key，内核本身不变就永远复用
      - name: 缓存内核源码
        id: cache-src
        uses: actions/cache@v4
        with:
          path: android-kernel
          key: kernel-src-a14-6.1

      # 缓存2：Bazel编译产物，hello.c改动才失效
      - name: 缓存Bazel编译环境
        id: cache-bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-cache-a14-6.1-${{ hashFiles('hello.c') }}
          restore-keys: |
            bazel-cache-a14-6.1-

      - name: 安装 repo
        run: |
          sudo curl https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          git config --global user.email "bot@example.com"
          git config --global user.name "bot"

      - name: 拉取 Android14-6.1 内核
        if: steps.cache-src.outputs.cache-hit != 'true'
        run: |
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android14-6.1 --no-repo-verify --depth=1
          repo sync --force-sync --no-clone-bundle --no-tags -j32
          # 删除 .repo 缩小缓存避免超限
          rm -rf .repo

      # 预编译内核主目标，移除无法识别的 --no_abi_generation
      - name: 预构建内核基础环境（避免每次重编完整内核）
        run: |
          cd android-kernel
          tools/bazel build \
            --config=fast \
            --disk_cache=~/.cache/bazel \
            --nokmi_symbol_list_violations_check \
            //common:kernel_aarch64

      - name: 准备驱动 (修正文件生成，适配Kleaf规范)
        run: |
          cd android-kernel
          mkdir -p common/drivers/hello
          
          # 拷贝源码，不存在则自动生成极简GPL驱动兜底
          if [ -f "../hello.c" ]; then
            cp ../hello.c common/drivers/hello/
          else
            echo '#include <linux/module.h>\n#include <linux/kernel.h>\nMODULE_LICENSE("GPL");\nint init_module(void){return 0;}\nvoid cleanup_module(void){}' > common/drivers/hello/hello.c
          fi
          
          # Kleaf编译模块仅需Kbuild，删除多余Makefile避免冲突
          printf "obj-m += hello.o\n" > common/drivers/hello/Kbuild
          rm -f common/drivers/hello/Makefile

          # 修正BUILD：只编译hello.c，禁止glob匹配全部文件
          printf 'load("//build/kernel/kleaf:kernel.bzl", "kernel_module")\n\n' > common/drivers/hello/BUILD
          printf 'kernel_module(\n' >> common/drivers/hello/BUILD
          printf '    name = "hello",\n' >> common/drivers/hello/BUILD
          printf '    srcs = ["hello.c"],\n' >> common/drivers/hello/BUILD
          printf '    outs = ["hello.ko"],\n' >> common/drivers/hello/BUILD
          printf '    kernel_build = "//common:kernel_aarch64",\n' >> common/drivers/hello/BUILD
          printf ')\n' >> common/drivers/hello/BUILD

      # 模块编译命令移除 --no_abi_generation，其余提速参数保留
      - name: 🚀 极速编译单模块
        run: |
          cd android-kernel
          tools/bazel build \
            --config=fast \
            --disk_cache=~/.cache/bazel \
            --jobs=$(nproc) \
            --local_ram_resources=HIGH \
            --nokmi_symbol_list_violations_check \
            //common/drivers/hello:hello

      - name: 上传 ko
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hello-ko
          path: android-kernel/bazel-bin/common/drivers/hello/hello.ko
