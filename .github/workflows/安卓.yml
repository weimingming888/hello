name: Build Android14 GKI KO (Bazel Kleaf android14-6.1 Repo Standard)
on:
  push:
    branches: [ main ]
  workflow_dispatch

jobs:
  build-gki-module:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取驱动源码（hello.c 仓库根目录）
      - name: Checkout custom module source
        uses: actions/checkout@v4

      # 2. 系统依赖 + repo 安装 + git 全局配置
      - name: Install build dependencies & repo
        run: |
          sudo apt update -y
          sudo apt install -y git python3 python-is-python3 bison flex libncurses-dev bc libelf-dev elfutils unzip curl build-essential zip
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      # 3. Repo 同步 android14-6.1 ACK 内核 三重重试
      - name: Repo sync kernel android14-6.1
        run: |
          mkdir -p kernel
          cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b android14-6.1 --depth=1
          repo sync -j$(nproc) || repo sync -j$(nproc) || repo sync -j$(nproc)
        env:
          # 缓解Google源访问超时
          GIT_HTTP_LOW_SPEED_LIMIT: 1024
          GIT_HTTP_LOW_SPEED_TIME: 120

      # 4. 部署GKI模块 单引号EOF防止YAML变量插值爆红（关键修复）
      - name: Prepare hello GKI module
        run: |
          cd kernel
          mkdir -p modules/hello_mod
          cp ../hello.c modules/hello_mod/hello.c
          cat > modules/hello_mod/BUILD.bazel <<'EOF'
load("//build/kernel/kleaf:kernel.bzl", "ddk_module")

ddk_module(
    name = "hello",
    srcs = ["hello.c"],
    out = "hello.ko",
    kernel_build = "//:kernel_aarch64",
    gki_module = True,
    copts = [
        "-std=gnu11",
        "-ffreestanding",
    ],
)
EOF

      # 5. Bazel Kleaf 编译arm64 GKI模块（精简官方平台参数）
      - name: Build GKI module with official toolchain
        run: |
          cd kernel
          chmod +x ./tools/bazel
          ./tools/bazel build //modules/hello_mod:hello --config=kernel_aarch64

      # 6. 提取编译产物，校验ko是否生成
      - name: Extract compiled ko artifact
        run: |
          set -e
          KO_PATH=$(find kernel/bazel-out -name "hello.ko" -type f | head -n1)
          if [ -z "$KO_PATH" ]; then
            echo "ERROR: hello.ko not found, build failed!"
            exit 1
          fi
          cp "$KO_PATH" ./
          ls -lh hello.ko
          modinfo hello.ko || echo "modinfo skip: cross-compile arch mismatch"

      # 7. 上传编译ko产物
      - name: Upload compiled KO
        uses: actions/upload-artifact@v4
        with:
          name: android14-6.1-repo-gki-hello-ko
          path: hello.ko
