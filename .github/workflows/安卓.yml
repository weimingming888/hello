name: Build Android ARM64 KO
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 替换为稳定安装方案
      - name: Get Android Clang 17（官方脚本+清华镜像加速）
        run: |
          sudo apt update -y
          wget https://mirrors.tuna.tsinghua.edu.cn/llvm-apt/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17 all -m https://mirrors.tuna.tsinghua.edu.cn/llvm-apt
          echo "PATH=/usr/bin:$PATH" >> $GITHUB_ENV
          clang-17 --version

      # 拉取内核源码
      - name: Pull Kernel Source
        run: |
          git clone --depth=1 --branch android14-6.1 https://android.googlesource.com/kernel/common kernel
          cd kernel
          cp ../device.config .config

      # 内核预处理
      - name: Prepare Kernel Modules
        run: |
          cd kernel
          export PATH=${{ env.PATH }}
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 modules_prepare -j$(nproc)

      # 编译ko
      - name: Build KO Module
        run: |
          export PATH=${{ env.PATH }}
          make -j$(nproc) KDIR=./kernel ARCH=arm64 LLVM=1

      # 上传产物
      - name: Upload KO File
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-ko
          path: hello.ko
