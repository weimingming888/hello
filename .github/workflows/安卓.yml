name: Build Android14 GKI KO (Bazel Kleaf android14-6.1 Repo Standard)
on:
  push:
    branches: [ main ]
  workflow_dispatch

jobs:
  build-gki-module:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取驱动源码（hello.c 放在仓库根目录）
      - name: Checkout custom module source
        uses: actions/checkout@v4

      # 2. 安装系统依赖 + repo工具，补充git全局配置
      - name: Install build dependencies & repo
        run: |
          sudo apt update -y
          sudo apt install -y git python3 python-is-python3 bison flex libncurses-dev bc libelf elfutils unzip curl build-essential zip
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      # 3. Repo 拉取完整 android14-6.1 ACK 内核，增加重试机制
      - name: Repo sync kernel android14-6.1
        run: |
          mkdir kernel
          cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b android14-6.1
          repo sync -j$(nproc) || repo sync -j$(nproc) || repo sync -j$(nproc)

      # 4. 部署自定义内核模块，修复EOF爆红问题
      - name: Prepare hello GKI module
        run: |
          cd kernel
          mkdir -p modules/hello_mod
          cp ../hello.c modules/hello_mod/hello.c
          cat > modules/hello_mod/BUILD.bazel <<'EOF'
load("//build/kernel/kleaf:kernel.bzl", "ddk_module")

ddk_module(
    name = "hello",
    srcs = ["hello.c"],
    out = "hello.ko",
    kernel_build = "//:kernel_aarch64",
    deps = ["//:kernel_aarch64"],
    gki_module = True,
    copts = [
        "-std=gnu11",
        "-ffreestanding",
    ],
)
EOF

      # 5. Kleaf Bazel 编译 arm64 GKI 模块
      - name: Build GKI module with official toolchain
        run: |
          cd kernel
          chmod +x ./tools/bazel
          ./tools/bazel build --platforms=//build/kernel/kleaf:kernel_aarch64_platform //modules/hello_mod:hello

      # 6. 自动搜索ko，兼容所有编译变体
      - name: Extract compiled ko artifact
        run: |
          find kernel/bazel-out -name "hello.ko" -type f -exec cp {} ./ \;
          ls -lh hello.ko
          modinfo hello.ko || echo "modinfo skip: cross-compile arch mismatch"

      # 7. 上传产物
      - name: Upload compiled KO
        uses: actions/upload-artifact@v4
        with:
          name: android14-6.1-repo-gki-hello-ko
          path: hello.ko
