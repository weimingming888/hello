name: Build Android ARM64 KO
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 完整依赖 + 修复llvm.sh 404（改用官方源apt.llvm.org）
      - name: Install Full LLVM 17 Toolchain & System Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libelf-dev elfutils libarchive-dev zlib1g-dev \
            libcap-dev libncurses-dev bison flex libssl-dev bc

          # 【修复404】使用官方llvm.sh地址，不再访问清华失效链接
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17 all

          # 全局软链接 clang17 -> clang
          TOOLS=(
            clang clang++ lld ld.lld
            llvm-ar llvm-nm llvm-objcopy llvm-strip llvm-objdump
            llvm-readelf llvm-readobj llvm-size llvm-strings llvm-cxxfilt
            llvm-as llvm-dis llvm-link llvm-mc llvm-ranlib llvm-symbolizer
          )
          for tool in "${TOOLS[@]}"; do
            sudo ln -sf /usr/bin/${tool}-17 /usr/bin/$tool
          done

          echo "PATH=/usr/bin:$PATH" >> $GITHUB_ENV
          # 校验工具完整性
          echo "===== Verify all LLVM tools ====="
          for tool in "${TOOLS[@]}"; do
            if command -v $tool &>/dev/null; then
              echo "[OK] $tool : $($tool --version | head -n1)"
            else
              echo "[FAIL] $tool missing!"
              exit 1
            fi
          done

      # 拉取一加SM8650 6.1内核
      - name: Pull Kernel Source
        run: |
          git clone --depth=1 --branch oneplus/sm8650_v_15.0.0_oneplus12 https://github.com/cctv18/android_kernel_common_oneplus_sm8650 kernel
          cp ../device.config kernel/.config

      # 内核预处理：强制gnu11 + thin LTO，关闭符号裁剪
      - name: Prepare Kernel Modules
        run: |
          cd kernel
          export PATH=${{ env.PATH }}
          export LLVM_AR=llvm-ar
          export LLVM_NM=llvm-nm
          export LLVM_OBJCOPY=llvm-objcopy
          export LLVM_STRIP=llvm-strip

          # 关闭KSYM裁剪，避免CRC不匹配
          sed -i 's/^CONFIG_TRIM_UNUSED_KSYMS=y/# CONFIG_TRIM_UNUSED_KSYMS is not set/' .config
          sed -i 's|CONFIG_UNUSED_KSYMS_WHITELIST=.*|# CONFIG_UNUSED_KSYMS_WHITELIST is not set|' .config

          # 全局锁定gnu11 + thin LTO，和手机内核编译参数对齐
          export KBUILD_CFLAGS="-std=gnu11 -flto=thin"
          export KBUILD_LDFLAGS="-flto=thin"

          make ARCH=arm64 CC=clang CXX=clang++ LD=ld.lld LLVM=1 LLVM_IAS=1 olddefconfig
          make ARCH=arm64 CC=clang CXX=clang++ LD=ld.lld LLVM=1 LLVM_IAS=1 prepare

          # 强制内核版本6.1.75
          mkdir -p include/generated
          if [ ! -f include/generated/utsrelease.h ]; then
            echo '#define UTS_RELEASE "6.1.75"' > include/generated/utsrelease.h
          fi
          sed -i 's/#define UTS_RELEASE ".*"/#define UTS_RELEASE "6.1.75"/' include/generated/utsrelease.h
          echo "Kernel release fixed: $(cat include/generated/utsrelease.h)"

          # 模块依赖预编译（带gnu11参数）
          make ARCH=arm64 CC=clang CXX=clang++ LD=ld.lld LLVM=1 LLVM_IAS=1 modules_prepare -j$(nproc)

      # 编译KO：EXTRA_CFLAGS强制gnu11、禁用PI、匹配LTO
      - name: Build KO Module
        run: |
          export PATH=${{ env.PATH }}
          make -j$(nproc) \
            KDIR=./kernel \
            ARCH=arm64 \
            CC=clang \
            CXX=clang++ \
            LD=ld.lld \
            LLVM=1 \
            EXTRA_CFLAGS="-std=gnu11 -ffreestanding -fno-pie -fno-plt -flto=thin"
          modinfo hello.ko || true

      # 上传编译产物
      - name: Upload KO File
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-ko
          path: hello.ko
