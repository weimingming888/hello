name: Build Android ARM64 KO
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    # 基础依赖 + clang17 直接apt安装，规避github下载失败
    - name: Install deps & Clang17
      run: |
        sudo apt update
        sudo apt install -y build-essential bison flex libssl-dev libelf-dev git xz-utils clang-17 lld-17 llvm-17
        ln -sf /usr/bin/clang-17 $HOME/.local/bin/clang
        ln -sf /usr/bin/clang++-17 $HOME/.local/bin/clang++
        ln -sf /usr/bin/lld-17 $HOME/.local/bin/lld
        ln -sf /usr/bin/llvm-ar-17 $HOME/.local/bin/llvm-ar
        ln -sf /usr/bin/llvm-nm-17 $HOME/.local/bin/llvm-nm
        echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV

    # 拉取内核源码
    - name: Pull Kernel Source
      run: |
        git clone --depth=1 --branch android14-6.1 https://android.googlesource.com/kernel/common kernel
        cd kernel
        # 本地仓库复制config，无外网url
        cp ../device.config .config

    # 内核预处理
    - name: Prepare Kernel Modules
      run: |
        cd kernel
        export PATH=${{ env.PATH }}
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 modules_prepare -j$(nproc)

    # 编译ko
    - name: Build KO Module
      run: |
        export PATH=${{ env.PATH }}
        make -j$(nproc) KDIR=./kernel ARCH=arm64 LLVM=1

    # 上传产物
    - name: Upload KO File
      uses: actions/upload-artifact@v4
      with:
        name: android-arm64-ko
        path: hello.ko
