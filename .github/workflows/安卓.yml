name: Build Android ARM64 KO (Find nearest 6.1.75)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 完整依赖安装 + 全套LLVM17软链接
      - name: Install Full LLVM 17 Toolchain & System Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libelf-dev elfutils libarchive-dev zlib1g-dev \
            libcap-dev libncurses-dev bison flex libssl-dev bc

          wget https://mirrors.tuna.tsinghua.edu.cn/llvm-apt/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17 all -m https://mirrors.tuna.tsinghua.edu.cn/llvm-apt

          TOOLS=(
            clang clang++ lld ld.lld
            llvm-ar llvm-nm llvm-objcopy llvm-strip llvm-objdump
            llvm-readelf llvm-readobj llvm-size llvm-strings llvm-cxxfilt
            llvm-as llvm-dis llvm-link llvm-mc llvm-ranlib llvm-symbolizer
          )
          for tool in "${TOOLS[@]}"; do
            sudo ln -sf /usr/bin/${tool}-17 /usr/bin/$tool
          done

          echo "PATH=/usr/bin:$PATH" >> $GITHUB_ENV

          echo "===== Verify all LLVM tools ====="
          for tool in "${TOOLS[@]}"; do
            if command -v $tool &>/dev/null; then
              echo "[OK] $tool : $($tool --version | head -n1)"
            else
              echo "[FAIL] $tool missing!"
              exit 1
            fi
          done
          ls /usr/include/libelf.h

      # 浅克隆内核，不拉全历史，杜绝长时间卡死
      - name: Pull Kernel Source & Search nearest 6.1.75 commit
        run: |
          git clone --depth=1 --branch android14-6.1 https://android.googlesource.com/kernel/common kernel
          cd kernel
          cp ../device.config .config

          # 增量拉取版本号文件历史，体积小、速度快，不会卡死
          git fetch origin android14-6.1 --shallow-exclude=HEAD --deepen=800 include/Makefile
          echo "======== 遍历查找小于等于6.1.75最近提交 ========"
          # 遍历修改内核版本的提交，匹配 6.1.x 小于等于75
          COMMIT_LIST=$(git log --oneline -- include/Makefile)
          FOUND_COMMIT=""
          while IFS= read -r line; do
            SHA=$(echo $line | awk '{print $1}')
            git show $SHA:include/Makefile > tmp_make.txt
            SUB_VER=$(grep -oP 'SUBLEVEL = \K\d+' tmp_make.txt || true)
            if [[ -n "$SUB_VER" && "$SUB_VER" -le 75 ]]; then
              FOUND_COMMIT=$SHA
              echo "找到匹配提交: $SHA , 补丁号 6.1.$SUB_VER"
              break
            fi
          done <<< "$COMMIT_LIST"

          if [[ -n "$FOUND_COMMIT" ]]; then
            git checkout $FOUND_COMMIT
            echo "已切换到最接近6.1.75提交: $FOUND_COMMIT"
          else
            echo "未找到<=75补丁号，使用分支最新版本"
          fi
          rm -f tmp_make.txt

      # 内核预处理：屏蔽符号裁剪，解决abi_symbollist.raw报错
      - name: Prepare Kernel Modules
        run: |
          cd kernel
          export PATH=${{ env.PATH }}
          export LLVM_AR=llvm-ar
          export LLVM_NM=llvm-nm
          export LLVM_OBJCOPY=llvm-objcopy
          export LLVM_STRIP=llvm-strip

          sed -i 's/^CONFIG_TRIM_UNUSED_KSYMS=y/# CONFIG_TRIM_UNUSED_KSYMS is not set/' .config
          sed -i 's|CONFIG_UNUSED_KSYMS_WHITELIST=.*|# CONFIG_UNUSED_KSYMS_WHITELIST is not set|' .config

          make ARCH=arm64 CC=clang CXX=clang++ LD=ld.lld LLVM=1 LLVM_IAS=1 olddefconfig
          make ARCH=arm64 CC=clang CXX=clang++ LD=ld.lld LLVM=1 LLVM_IAS=1 modules_prepare -j$(nproc)
          cat include/generated/utsrelease.h

      # 编译外部KO模块
      - name: Build KO Module
        run: |
          export PATH=${{ env.PATH }}
          make -j$(nproc) KDIR=./kernel ARCH=arm64 CC=clang CXX=clang++ LD=ld.lld LLVM=1
          modinfo hello.ko || true

      # 上传编译产物
      - name: Upload KO File
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-ko
          path: hello.ko
